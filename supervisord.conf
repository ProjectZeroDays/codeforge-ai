[supervisord]
nodaemon=true
user=user
logfile=/app/data/supervisord.log
pidfile=/app/data/supervisord.pid

[program:backend]
command=/opt/venv/bin/python -m uvicorn backend.main:app --host 0.0.0.0 --port 8000
directory=/app
autostart=true
autorestart=true
stdout_logfile=/app/data/backend.log
stderr_logfile=/app/data/backend_error.log
environment=DATABASE_URL="%(ENV_DATABASE_URL)s",SECRET_KEY="%(ENV_SECRET_KEY)s",VENICE_API_KEY="%(ENV_VENICE_API_KEY)s",USE_SQLITE="%(ENV_USE_SQLITE)s"

[program:frontend]
command=npm start
directory=/app/frontend
autostart=true
autorestart=true
stdout_logfile=/app/data/frontend.log
stderr_logfile=/app/data/frontend_error.log
environment=PORT="7860",NODE_ENV="production",BACKEND_URL="http://localhost:8000"
