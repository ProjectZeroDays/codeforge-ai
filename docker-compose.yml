# =============================================================================
# CodeForge AI - Docker Compose for Local Testing
# =============================================================================
# Run: docker-compose up --build
# =============================================================================

version: '3.8'

services:
  # Full application with Next.js frontend
  codeforge-full:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: codeforge-ai-full
    ports:
      - "7860:7860"
    environment:
      - DATABASE_URL=sqlite:///app/data/codeforge.db
      - SECRET_KEY=${SECRET_KEY:-your-secret-key-change-in-production}
      - VENICE_API_KEY=${VENICE_API_KEY:-}
      - GITHUB_PERSONAL_ACCESS_TOKEN=${GITHUB_PERSONAL_ACCESS_TOKEN:-}
      - GITHUB_USERNAME=${GITHUB_USERNAME:-}
      - HOST=0.0.0.0
      - PORT=7860
      - DEBUG=false
      - USE_SQLITE=true
    volumes:
      - codeforge-data:/app/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:7860/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    restart: unless-stopped

  # Lightweight Gradio-only version
  codeforge-gradio:
    build:
      context: .
      dockerfile: Dockerfile.gradio
    container_name: codeforge-ai-gradio
    ports:
      - "7861:7860"
    environment:
      - DATABASE_URL=sqlite:///app/data/codeforge.db
      - SECRET_KEY=${SECRET_KEY:-your-secret-key-change-in-production}
      - VENICE_API_KEY=${VENICE_API_KEY:-}
      - GITHUB_PERSONAL_ACCESS_TOKEN=${GITHUB_PERSONAL_ACCESS_TOKEN:-}
      - HOST=0.0.0.0
      - PORT=7860
      - USE_SQLITE=true
    volumes:
      - codeforge-gradio-data:/app/data
    restart: unless-stopped
    profiles:
      - gradio

  # PostgreSQL database (optional, for local development with full DB)
  postgres:
    image: postgres:15-alpine
    container_name: codeforge-postgres
    environment:
      - POSTGRES_USER=codeforge
      - POSTGRES_PASSWORD=codeforge_password
      - POSTGRES_DB=codeforge_db
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U codeforge -d codeforge_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    profiles:
      - postgres
    restart: unless-stopped

volumes:
  codeforge-data:
  codeforge-gradio-data:
  postgres-data:

networks:
  default:
    name: codeforge-network
